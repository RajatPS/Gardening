services:
  - type: web
    name: gardening
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        sync: false   # Set this manually in Render dashboard to your full URL e.g. https://gardening-anxw.onrender.com
      - key: FILESYSTEM_DISK
        value: public
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_STORE
        value: file
